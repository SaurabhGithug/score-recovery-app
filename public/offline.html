<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#0f172a" />
    <title>Score Recovery — Offline</title>
    <style>
      *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f8fafc;color:#0f172a;font-family:system-ui,-apple-system,sans-serif}.card{width:min(100%,420px);border:1px solid #e2e8f0;border-radius:24px;background:#fff;padding:32px;text-align:center;box-shadow:0 12px 35px rgba(15,23,42,.08)}.icon{display:grid;place-items:center;width:56px;height:56px;margin:auto;border-radius:16px;background:#2563eb;color:#fff;font-weight:800}h1{font-size:22px;margin:20px 0 8px}p{margin:0;color:#64748b;font-size:14px;line-height:1.55}button{margin-top:24px;border:0;border-radius:12px;background:#0f172a;color:#fff;padding:11px 18px;font-weight:700;cursor:pointer}
    </style>
  </head>
  <body>
    <main class="card">
      <div class="icon">SR</div>
      <h1>You’re offline</h1>
      <p>Reconnect to learn, sign in, or save progress. Your previously saved progress stays on the server. Unsaved answers are not guaranteed to be saved while offline.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
